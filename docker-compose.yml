version: '3.8'
services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - db
      - cache
    environment:
      - REDIS_HOST=cache
      - DB_HOST=db
    # Security Best Practices (Example - Read-only filesystem)
    read_only: true
    tmpfs: /tmp # Use tmpfs for temporary files
    security_opt:
      - no-new-privileges:true
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=mydb
    volumes:
      - db_data:/var/lib/postgresql/data
    # Security Best Practices (Example - Resource limits)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
  cache:
    build:
      context: ./cache
      dockerfile: Dockerfile
    ports:
      - "6379:6379"
    # Security Best Practices (Example - User)
    # user: nobody
volumes:
  db_data: